services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9092:9092" # host access (non-docker dev) — see PLAINTEXT_HOST below
    environment:
      # Single-node KRaft mode (no separate Zookeeper container). Three
      # listeners: PLAINTEXT is for container-to-container traffic
      # (backend/mail-service reach it as "kafka:19092"), CONTROLLER is
      # KRaft-internal, PLAINTEXT_HOST is the host-mapped port above for
      # running those services outside Docker against this broker.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  mail-service:
    build:
      context: ./mail-service
    restart: unless-stopped
    env_file:
      - ./mail-service/.env
    environment:
      KAFKA_BROKERS: kafka:19092
      NODE_ENV: development
      FRONTEND_URL: http://localhost:8000
    depends_on:
      kafka:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Loads JWT/Cloudinary secrets already kept in backend/.env; DB_* and
    # PORT below are overridden because inside compose the backend must talk
    # to the "mysql" service on the internal network, not the host DB used
    # for local (non-docker) dev.
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ecommerce}
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:8000
      # Mail is sent by the separate mail-service container over this
      # broker, not by the backend itself — see mail-service above.
      KAFKA_BROKERS: kafka:19092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3001:3000"
    # typeorm's compiled CLI (a runtime dep, unlike the ts-node-based
    # migration:run script) runs migrations against dist/ before nest starts,
    # so a fresh mysql volume gets its schema without a manual step.
    command: sh -c "node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js && node dist/main"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — must be reachable from
        # the browser, so it's the published host port, not the internal
        # "backend" service name.
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  mysql_data:
