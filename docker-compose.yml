services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Single-node replica set: the backend uses multi-document transactions
    # (orders, cart, refresh-token rotation), which MongoDB only supports on a
    # replica set. --bind_ip_all lets other containers reach it.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # Initiates the replica set on first run (rs.status() throws until then),
    # and only reports healthy once this node is the writable primary.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Loads JWT/Cloudinary secrets already kept in backend/.env; MONGODB_URI
    # and PORT below are overridden because inside compose the backend must
    # talk to the "mongo" service on the internal network, not the host DB
    # used for local (non-docker) dev.
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:8000
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — must be reachable from
        # the browser, so it's the published host port, not the internal
        # "backend" service name.
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  mongo_data:
